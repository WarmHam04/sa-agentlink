name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Agent runtime and version
      placeholder: codex-cli 0.x / gemini 0.x / claude code x.y
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal workflow with secrets removed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
