server:
  port: 8096

otel:
  service:
    name: sa-agentlink
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}

spring:
  application:
    name: agentlink

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

agentlink:
  region: ${AGENTLINK_REGION:local}
  persistence:
    mode: ${AGENTLINK_PERSISTENCE_MODE:memory}
    fail-interrupted-on-startup: true
    jdbc:
      url: ${AGENTLINK_JDBC_URL:jdbc:postgresql://localhost:5432/agentlink}
      username: ${AGENTLINK_JDBC_USERNAME:agentlink}
      password: ${AGENTLINK_JDBC_PASSWORD:agentlink}
  events:
    history-limit: 1000
  outbox:
    poll-interval: 1000
    claim-ttl: PT30S
    max-attempts: 8
    initial-backoff: PT1S
    max-backoff: PT5M
  tenancy:
    default-requests-per-minute: 600
    default-workflows-per-day: 10000
    default-max-active-workflows: 100
    reservation-ttl: PT15M
    rate-bucket-retention: P2D
    maintenance-interval: 3600000
  cluster:
    instance-id: ${AGENTLINK_INSTANCE_ID:${random.uuid}}
    workflow-lease-ttl: PT30S
    workflow-lease-renew-interval: 10000
    agent-registration-ttl: PT45S
    agent-registry-prune-interval: 30000
    agent-registry-renew-interval: 15000
  execution:
    pool-size: 8
  runtimes:
    bootstrap-cli: true
    demo-agents: true
    workspace-root: ${AGENTLINK_WORKSPACE_ROOT:${user.dir}}
    timeout: PT10M
    max-artifact-chars: 100000
  security:
    mode: ${AGENTLINK_SECURITY_MODE:permit-all}
    tenant-claim: ${AGENTLINK_TENANT_CLAIM:tenant_id}
    default-tenant: ${AGENTLINK_DEFAULT_TENANT:_default}
    allow-private-agent-networks: ${AGENTLINK_ALLOW_PRIVATE:false}
  a2a:
    public-base-url: ${AGENTLINK_PUBLIC_BASE_URL:http://localhost:8096}
    blocking-timeout: PT2M
